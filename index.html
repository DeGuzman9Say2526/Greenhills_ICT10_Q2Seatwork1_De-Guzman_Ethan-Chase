<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>SEATWORK 1</title>
</head>
<body>
    <main class="main-card">
        <h1>Discover East Asian Nicknames</h1>

        <div class="country-form-box">
            <input id="country" name="country" type="text" placeholder="Enter a country (e.g. Japan, China)" aria-label="Country name">

            <button id="nickname-button" type="button" class="btn nickname-button" py-click="show_nickname">Find Nickname</button>
        </div>

        <div id="result" class="result-box" aria-live="polite"></div>
    </main>

    <script type="py" src="main.py"></script>
</body>
</html>
